<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech Tool</title>
    <link rel="stylesheet" href="../CSS/styleTTS.css">
</head>
<body>
    <div class="container">
        <!-- Back button -->
        <div class="back-button-container">
            <button id="backBtn" class="btn-back" onclick="window.location.href='menu.html'">
                ← Quay lại Menu
            </button>
        </div>
        <h1>🎤 Text to Speech Tool</h1>
        
        <div class="form-group">
            <label for="text">Nhập văn bản cần đọc:</label>
            <textarea id="text" placeholder="Nhập văn bản bạn muốn chuyển thành giọng nói..." spellcheck="false">Xin chào! Đây là công cụ chuyển văn bản thành giọng nói.</textarea>
        </div>
        
        <div class="form-group">
            <label for="voice">Chọn giọng nói:</label>
            <select id="voice">
                <option value="">Đang tải...</option>
            </select>
            <div class="voice-info" id="voiceInfo"></div>
        </div>
        
        <div class="form-group">
            <label for="speed">Tốc độ đọc:</label>
            <select id="speed">
                <option value="0.5">Rất chậm (0.5x)</option>
                <option value="0.75">Chậm (0.75x)</option>
                <option value="1" selected>Bình thường (1x)</option>
                <option value="1.25">Nhanh (1.25x)</option>
                <option value="1.5">Rất nhanh (1.5x)</option>
                <option value="2">Cực nhanh (2x)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="pitch">Cao độ giọng nói:</label>
            <select id="pitch">
                <option value="0.5">Rất thấp</option>
                <option value="0.75">Thấp</option>
                <option value="1" selected>Bình thường</option>
                <option value="1.25">Cao</option>
                <option value="1.5">Rất cao</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="volume">Âm lượng:</label>
            <select id="volume">
                <option value="0.3">Nhỏ</option>
                <option value="0.5">Vừa</option>
                <option value="0.7">Lớn</option>
                <option value="1" selected>Tối đa</option>
            </select>
        </div>
        
        <div class="controls">
            <button id="speakBtn" class="btn-primary">🔊 Phát giọng nói</button>
            <button id="pauseBtn" class="btn-secondary">⏸️ Tạm dừng</button>
            <button id="resumeBtn" class="btn-secondary">▶️ Tiếp tục</button>
            <button id="stopBtn" class="btn-danger">⏹️ Dừng</button>
            <button id="exportBtn" class="btn-secondary">💾 Xuất MP3</button>
        </div>
        
        <div id="status" class="status"></div>
    </div>

    <script src="../JavaScript/tts.js"></script>
    <script src="../JavaScript/tts-page.js"></script>
</body>
</html>

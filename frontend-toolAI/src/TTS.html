<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://cdn.jsdelivr.net 'unsafe-eval';
  style-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
  connect-src 'self';
  media-src 'self' blob:;
">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chuyển Văn Bản Thành Giọng Nói</title>
  <link rel="stylesheet" href="../CSS/styleTTS.css" />
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" /> -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Chuyển Văn Bản Thành Giọng Nói</h1>
      <p class="subtitle">Nhập văn bản và tạo giọng nói tự động với nhiều tùy chọn</p>
    </header>

    <main>
      <div class="form-section">
        <div class="form-group">
          <label for="voice">Chọn giọng nói:</label>
          <select id="voice">
            <option value="alloy">Alloy</option>
            <option value="ash">Ash</option>
            <option value="coral">Coral</option>
            <option value="echo">Echo</option>
            <option value="fable">Fable</option>
            <option value="onyx">Onyx</option>
            <option value="nova">Nova</option>
            <option value="sage">Sage</option>
            <option value="shimmer">Shimmer</option>
          </select>
        </div>

        <div class="form-group">
          <label for="text">Nhập văn bản:</label>
          <textarea id="text" rows="8" cols="60" placeholder="Nhập đoạn văn bản tại đây..."></textarea>
        </div>

        <div class="form-group">
          <label for="speed">Tốc độ đọc:</label>
          <select id="speed">
            <option value="0.5">0.5x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.5">1.5x</option>
            <option value="2.0">2.0x</option>
          </select>
        </div>

        <div class="button-group">
          <button id="speakBtn"> Tạo Giọng Nói</button>
        </div>
      </div>

      <div class="preview-section">
        <div class="player">
          <audio id="audioPreview" controls></audio>
        </div>

        <div class="button-group">
          <button id="download"> Tải Xuống</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../Javascript/tts-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
  <title>Chức năng Gợi ý kịch bản</title>
  <link rel="stylesheet" href="../CSS/style_create_script.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <!-- Bên trái -->
    <div class="left-panel">
      <h2>🎧 Chức năng Gợi ý kịch bản</h2>
      <p class="desc">Đưa ra tiêu đề video, sau đó gợi ý kịch bản video.</p>

      <div>
        <label for="video-title">1️⃣ Nhập tiêu đề video của bạn</label>
        <textarea id="video-title" placeholder="Ví dụ: Ẩm thực Việt..."spellcheck="false"></textarea>
      </div>

      <div class="option">
        <label>2️⃣ 🔑 Cài Đặt Khác</label>
        <div class="checkbox-group">
          <label><input type="checkbox" value="food"> Kịch bản ẩm thực</label><br>
          <label><input type="checkbox" value="review"> Kịch bản review</label><br>
          <label><input type="checkbox" value="vlog"> Kịch bản vlog</label>
        </div>
      </div>

      <button class="btn" id="generate-script-btn">Tạo kịch bản</button>
    </div>

    <!-- Bên phải -->
    <div class="right-panel">
      <h3>Gợi ý kịch bản</h3>
      <div class="output-box">
      <ul id="suggested-script"></ul>
      <ul id="other-script-suggestions"></ul>
          <!-- Các đoạn kịch bản phụ -->
        </ul>
      </div>
    </div>
  </div>
<script src="../JavaScript/renderer.js"></script>
</body>
</html>

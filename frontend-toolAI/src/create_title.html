<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
  <title>Chức năng Gợi ý kịch bản</title>
  <link rel="stylesheet" href="../CSS/style_create_script.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <!-- Bên trái -->
    <div class="left-panel">
      <h2>🔴 Chức năng Gợi ý tiêu đề</h2>
      <p class="desc">Đưa ra nội dung video, từ đó gợi ý tiêu đề làm thu hút người xem.</p>

      <div>
        <label for="video-title">1️⃣ Nhập nội dung video của bạn</label>
        <textarea id="video-title" autofocus placeholder="Ví dụ: Video về nấu ăn các món Hà Nội trong 30 phút, gồm có các món..." spellcheck="false"></textarea>
      </div>

      <div class="option">
        <label>2️⃣ 🔑 Cài Đặt Khác</label>
        <div class="checkbox-group">
          <label><input type="checkbox" value="Trẻ em"> Tiêu đề dành cho trẻ em</label><br>
          <label><input type="checkbox" value="Ngắn"> Tiêu đề giới hạn trong 10 từ</label><br>
          <label><input type="checkbox" value="Vlog"> Tiêu đề vlog</label>
        </div>
      </div>

      <button class="btn" id="generate-btn">Tạo tiêu đề</button>
    </div>

    <!-- Bên phải -->
    <div class="right-panel">
      <h3>Tiêu đề gợi ý</h3>
      <div class="output-box" id="output-box">
        <h3>Tiêu đề gợi ý:</h3>
        <ul id="suggested-titles">
        </ul>

        <h3>Gợi ý khác:</h3>
        <ul id="other-suggestions">
          <!-- Gợi ý dài hơn sẽ hiển thị ở đây -->
        </ul>
      </div>
    </div>
  </div>

<script src="../JavaScript/renderer.js"></script>
</body>
</html>

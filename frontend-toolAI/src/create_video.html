<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo Video</title>
    <script defer src="../JavaScript/create_video.js"></script>
    <link rel="stylesheet" href="../CSS/style_create_video.css">
</head>
<body>
    <h1>Tạo Video</h1>

    <label>Tiêu đề video:</label>
    <input id="title" type="text"><br>

    <label>Kịch bản:</label><br>
    <textarea id="script" rows="5" cols="60" spellcheck="false"></textarea><br>

    <label>Giọng đọc:</label>
    <input type="file" id="voice"><br>

    <label>Nhạc nền (tuỳ chọn):</label>
    <input type="file" id="bgm"><br>

    <label>Âm lượng giọng đọc:</label>
    <input type="range" id="voiceVolume" min="0" max="100" value="100"><br>

    <label>Âm lượng nhạc nền:</label>
    <input type="range" id="bgmVolume" min="0" max="100" value="20"><br>

    <label>Chế độ:</label>
    <select id="mode">
        <option value="Thường">Thường</option>
        <option value="Tăng tốc">Tăng tốc</option>
    </select>

    <label><input type="checkbox" id="useGPU"> Dùng GPU</label><br><br>

    <button id="createBtn">Tạo Video</button>

    <pre id="log"></pre>
</body>
</html>

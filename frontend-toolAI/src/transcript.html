<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển transcript thành kịch bản</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style2.css">
</head>
<body>
    <div class="wrapper">
        <div class="left">
            <h3>🔴 Nhập đường link video → tạo kịch bản</h3>
            <p>Nhập đường link YouTube, hệ thống sẽ lấy transcript (nếu có) và tạo kịch bản từ đó.</p>
            <label>1 → Nhập link video của bạn</label>
            <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=abc123">
            <button id="generateScriptBtn">Tạo kịch bản</button>
        </div>
        <div class="right">
            <div class="output-box">
                <h4>Kịch bản:</h4>
                <p id="output">Chưa có nội dung</p>
            </div>
        </div>
    </div>
    <script src="../JavaScript/renderer.js"></script>
</body>
</html>
